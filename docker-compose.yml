version: '3.8'

services:
  # Traefik: Edge Router & Reverse Proxy
  router:
    image: traefik:v2.10
    container_name: buyholdtime-router
    restart: always
    command:
      - "--api.insecure=true" # Habilita el dashboard en el puerto 8080
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080" # Traefik Dashboard (http://localhost:8080)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - buyholdtime-network

  # Database: PostgreSQL 15
  database:
    image: postgres:15-alpine
    container_name: buyholdtime-db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (raíz)}
      POSTGRES_DB: buyholdtime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - buyholdtime-network

  # Cache: Redis 7
  cache:
    image: redis:7-alpine
    container_name: buyholdtime-cache
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - buyholdtime-network

  # pgAdmin: Database Client Console (enrutado a través de Traefik)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: buyholdtime-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@buyholdtime.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?define PGADMIN_PASSWORD en .env (raíz)}
    depends_on:
      - database
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.buyholdtime.localhost`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    networks:
      - buyholdtime-network

# DESARROLLO LOCAL: solo infraestructura, accesible únicamente desde 127.0.0.1.
# Producción (frontend + backend en contenedores): docker-compose.prod.yml

networks:
  buyholdtime-network:
    name: buyholdtime-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
